<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Generator</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Css Styling -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

<div class="card-container">
    <div class="card"> 
        <h2 class="card-title">Background Color Change</h2>

        <div class="color-preview" id="colorCode">#ffffff</div>

        <div class="button-group">
            <button type="button" id="start" class="btn btn-start">
                <i class="fa-solid fa-play"></i> Start
            </button>
            <button type="button" id="stop" class="btn btn-stop">
                <i class="fa-solid fa-pause"></i> Stop
            </button>
        </div>

        <button type="button" id="reset" class="btn btn-reset">
            <i class="fa-solid fa-arrow-rotate-right"></i> Reset
        </button> 

    </div>
</div>

<script src="script.js"></script>

</body>

</html>
